<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ T('app_name') }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="/">{{ T('app_name') }}</a></h1>
    <a class="add-link" href="/add">+ {{ T('add_medicine') }}</a>
    <nav class="langs" aria-label="{{ T('language') }}">
      {% for code in LANGS %}
      <a href="/lang/{{ code }}" class="lang-link{% if code == lang %} active{% endif %}">{{ code | upper }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
